services:
  # Local PostgreSQL service (no local PostgreSQL installation required on host)
  db:
    image: postgres:16-alpine
    container_name: kanban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanban_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Unified app service (FastAPI backend serving frontend SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kanban_db
      JWT_SECRET_KEY: mini-kanban-secret-jwt-key-2026-super-secure
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"

volumes:
  postgres_data:
