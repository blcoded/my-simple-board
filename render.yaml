services:
  - type: web
    name: kanban-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kanban-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: kanban-postgres
    databaseName: kanban_db
    user: kanban_user
    plan: free
    region: oregon
