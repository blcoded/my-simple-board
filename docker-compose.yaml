services:
  # PostgreSQL database service
  postgres:
    image: postgres:16-alpine
    container_name: kanban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kanban_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kanban_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Unified application service (FastAPI backend serving the frontend SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-kanban_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-mini-kanban-secret-jwt-key-2026-super-secure}
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"

volumes:
  postgres_data:
